name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: client

jobs:
  build-and-test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

  browser-qa:
    name: Responsive and component browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check responsive layouts
        run: npm run test:responsive
        env:
          QA_CAPTURE_PHASE: after
      - name: Check Storybook interactions
        run: npm run test:storybook
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            client/playwright-report/
            client/test-results/
            client/docs/qa/screenshots/after/
